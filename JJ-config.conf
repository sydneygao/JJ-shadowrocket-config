# ===== 地区节点 =====
# 香港：自动延迟优选
🇭🇰 香港节点 = url-test,url=http://www.gstatic.com/generate_204,interval=600,timeout=5,tolerance=100,select=0,policy-regex-filter=(?i)(?:🇭🇰|香港|港|HK|HKG|Hong[\s_-]*Kong)

# 其他地区：减少耗电，保持手动选择
🇯🇵 日本节点 = select,policy-regex-filter=(?i)(?:🇯🇵|日本|日|JP|JPN|Japan)
🇸🇬 新加坡节点 = select,policy-regex-filter=(?i)(?:🇸🇬|新加坡|新|SG|SGP|Singapore)
🇺🇸 美国节点 = select,policy-regex-filter=(?i)(?:🇺🇸|美国|美國|美|USA|United[\s_-]*States|(?<![A-Za-z])US(?![A-Za-z]))
🇨🇳 台湾节点 = select,policy-regex-filter=(?i)(?:台湾|台灣|台|TW|TWN|Taiwan)

